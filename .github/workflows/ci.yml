name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: check · validate · build
    runs-on: ubuntu-latest

    env:
      # Optional: pin the public site URL used for canonical links / sitemap / RSS.
      # Falls back to the default in astro.config.mjs when unset.
      DEVLOG_SITE_URL: ${{ vars.DEVLOG_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check the project (Astro + TS).
      - name: Type check
        run: npm run check

      # Validate article frontmatter, registries, alt text and filenames.
      - name: Validate content
        run: npm run validate

      # Production build — drafts / in-review posts are excluded here.
      - name: Build
        run: npm run build

      # Assert the build did NOT ship any draft/review post (HTML or search index).
      - name: Validate build output
        run: npm run validate:build

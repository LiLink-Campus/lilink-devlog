# CI for the PR-based article publishing workflow (draft → review → published).
#
# Every pull request (and every push to main) must pass content validation,
# type checking and a production build before it can merge. The production build
# already excludes draft/review posts (see src/lib/posts.ts), so a green build
# here guarantees unpublished content never ships, while `npm run validate`
# catches frontmatter / author / tag / link / media problems up front.
name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches engines.node ">=20.3.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Type check
        run: npm run check

      - name: Production build (excludes draft/review)
        run: npm run build
